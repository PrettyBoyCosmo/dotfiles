# ~/.tmux.conf
# tmux configuration
# created by : bluecosmo

# refresh binding
unbind r
bind r source-file ~/.tmux.conf

# navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -n C-M-h resize-pane -L 3
bind-key -n C-M-j resize-pane -D 3
bind-key -n C-M-k resize-pane -U 3
bind-key -n C-M-l resize-pane -R 3

# keep current working directory across panes
bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# options
set -g mouse on
setw -g mode-keys vi
set-option -g status-position bottom
set-option -g default-shell /bin/fish

# copy mode (vim keybinds)
set -s set-clipboard on  
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind P paste-buffer

# tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# run tpm
run '~/.tmux/plugins/tpm/tpm'

